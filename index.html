<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Water Lens - Custom Color</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#000; }
#c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair; }
#hud {
  position:fixed; top:10px; left:10px; right:10px;
  display:flex; align-items:flex-start; justify-content:space-between;
  pointer-events:none; z-index:20;
}
#dbg {
  font:11px/1.6 monospace; color:rgba(0,255,120,.9);
  background:rgba(0,0,0,.6); padding:5px 9px; border-radius:7px;
  white-space:pre; max-width:55vw;
}
#btn-cam {
  pointer-events:all;
  width:40px; height:40px; border-radius:50%;
  background:rgba(255,255,255,.18); backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.3);
  color:#fff; font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
#ui-bottom {
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  z-index:20; display:flex; gap:8px; align-items: center;
  background:rgba(0,0,0,.45); backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.14); border-radius:40px; padding:5px 7px;
}
.mb {
  padding:7px 22px; border-radius:28px; border:none;
  font-size:12px; font-weight:700; letter-spacing:.09em;
  cursor:pointer; transition:all .2s;
  color:rgba(255,255,255,.45); background:transparent;
}
.mb.on { background:rgba(255,255,255,.2); color:#fff; }

/* ── 新增：美化取色器样式 ── */
#tint-picker {
  -webkit-appearance: none;
  border: none;
  width: 28px; height: 28px;
  border-radius: 50%;
  overflow: hidden;
  cursor: pointer;
  background: transparent;
  padding: 0;
  margin-left: 4px;
}
#tint-picker::-webkit-color-swatch-wrapper { padding: 0; }
#tint-picker::-webkit-color-swatch { border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; }

#err {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.92);
  color:#f88; font:12px/1.8 monospace; padding:20px;
  white-space:pre-wrap; z-index:99; overflow:auto;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="dbg">INIT…</div>
  <button id="btn-cam">⟳</button>
</div>
<div id="ui-bottom">
  <button class="mb on" data-m="liquid">LIQUID</button>
  <button class="mb"    data-m="crystal">CRYSTAL</button>
  <input type="color" id="tint-picker" value="#73a5ff" title="调整水体颜色">
</div>
<div id="err"></div>
<script>
(function(){
'use strict';

const canvas = document.getElementById('c');
const dbg    = document.getElementById('dbg');
const errDiv = document.getElementById('err');

let gl, W, H, SW, SH;
let facingUser = true;
let stream=null, video=null, vidTex=null;
let pp=[null,null], cur=0;
let simP=null, renP=null, quadBuf=null;
let mode=0.0;

// ── 新增：存储颜色RGB值 ──
let tintRGB = [0.45, 0.65, 1.0];

const DECAY_FRAMES = 8;
let pts=[];
let ppts=[];

function log(s){ dbg.textContent=s; }
function die(s){ errDiv.style.display='block'; errDiv.textContent='ERROR:\n'+s; }

function initGL(){
  const o={alpha:false,antialias:false,depth:false,stencil:false};
  gl=canvas.getContext('webgl',o)||canvas.getContext('experimental-webgl',o);
  if(!gl){ die('WebGL n/a'); return false; }
  if(!gl.getExtension('OES_texture_float')){ die('float tex n/a'); return false; }
  gl.getExtension('OES_texture_float_linear');
  return true;
}
function mkShader(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
    const e=gl.getShaderInfoLog(s);
    throw new Error(e+'\n'+src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n'));
  }
  return s;
}
function mkProg(vs,fs){
  const p=gl.createProgram();
  gl.attachShader(p,mkShader(gl.VERTEX_SHADER,vs));
  gl.attachShader(p,mkShader(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
function mkFloatTex(w,h){
  const t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.FLOAT,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return t;
}
function mkFBO(tex){
  const f=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  const s=gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  if(s!==gl.FRAMEBUFFER_COMPLETE) throw new Error('FBO 0x'+s.toString(16));
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return f;
}
function ul(p,n){ return gl.getUniformLocation(p,n); }

function mkQuad(){
  quadBuf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
}
function drawQuad(p){
  gl.bindBuffer(gl.ARRAY_BUFFER,quadBuf);
  const a=gl.getAttribLocation(p,'a_pos');
  gl.enableVertexAttribArray(a);
  gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

const VS=`
attribute vec2 a_pos;
varying   vec2 v_uv;
void main(){
  v_uv=a_pos*0.5+0.5;
  gl_Position=vec4(a_pos,0.,1.);
}`;

const SIM_FS=`
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_tex;
uniform vec2  u_res;
uniform float u_mode;
uniform vec2  u_p[10];
uniform vec2  u_v[10];
uniform float u_n;

void main(){
  vec2 px=1./u_res;
  float c =texture2D(u_tex,v_uv).r;
  float pv=texture2D(u_tex,v_uv).g;

  float N =texture2D(u_tex,v_uv+vec2(   0, px.y)).r;
  float S =texture2D(u_tex,v_uv+vec2(   0,-px.y)).r;
  float E =texture2D(u_tex,v_uv+vec2( px.x,  0)).r;
  float W =texture2D(u_tex,v_uv+vec2(-px.x,  0)).r;
  float NE=texture2D(u_tex,v_uv+vec2( px.x, px.y)).r;
  float NW=texture2D(u_tex,v_uv+vec2(-px.x, px.y)).r;
  float SE=texture2D(u_tex,v_uv+vec2( px.x,-px.y)).r;
  float SW=texture2D(u_tex,v_uv+vec2(-px.x,-px.y)).r;
  float lap=(N+S+E+W)*0.2+(NE+NW+SE+SW)*0.05-c;

  float spd=0.50+u_mode*0.04;
  float h=2.*c-pv+lap*(spd*2.2);

  float bd=0.988+u_mode*0.006;
  h*=bd+(1.-bd)*smoothstep(0.,0.2,abs(h));

  vec2 uvF=vec2(v_uv.x, 1.-v_uv.y);
  vec2 ar =vec2(u_res.x/u_res.y,1.);

  for(int i=0;i<10;i++){
    float active=step(float(i),u_n-1.);
    if(active<0.5) continue;

    vec2 fp=u_p[i];
    vec2 fv=u_v[i];
    float spd2=length(fv)*120.;

    vec2 d2=(uvF-fp)*ar;
    float dist=length(d2);

    float presence=exp(-dist*dist*500.)*0.55;
    float ring=exp(-dist*dist*3000.)*1.2;

    vec2 pa=(uvF-(fp-fv*0.3))*ar;
    vec2 ba=fv*ar*0.3;
    float t2=clamp(dot(pa,ba)/max(dot(ba,ba),1e-5),0.,1.);
    float dcap=length(pa-ba*t2);
    float motion=exp(-max(dcap-0.02,0.)*60.)*spd2*0.8;

    h+=(presence+ring+motion)*active;
  }

  h=clamp(h,-1.,1.);
  gl_FragColor=vec4(h,c,0.,1.);
}`;

const REN_FS=`
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_wave;
uniform sampler2D u_vid;
uniform vec2  u_sr;
uniform float u_mode;
uniform float u_mirX;
uniform vec3  u_tint;  // ── 新增：接收从JS传来的颜色 ──

vec3 vid(vec2 uv){
  uv.y=1.-uv.y;
  uv.x=mix(uv.x,1.-uv.x,u_mirX);
  return texture2D(u_vid,clamp(uv,.001,.999)).rgb;
}

void main(){
  vec2 px=1./u_sr;
  float c =texture2D(u_wave,v_uv).r;
  float N =texture2D(u_wave,v_uv+vec2(   0, px.y)).r;
  float S =texture2D(u_wave,v_uv+vec2(   0,-px.y)).r;
  float E =texture2D(u_wave,v_uv+vec2( px.x,  0)).r;
  float W =texture2D(u_wave,v_uv+vec2(-px.x,  0)).r;

  vec2  grad=vec2(E-W,N-S)*.5;
  float lap=(N+S+E+W)*.25-c;

  float liq=1.-u_mode, cry=u_mode;

  float rs=0.55*liq+0.18*cry;
  float ls=0.60*liq+0.85*cry;
  vec2 off=grad*rs - grad*lap*ls*10.;

  float cd=0.005*liq+0.009*cry;
  float r=vid(v_uv+off+grad*cd).r;
  float g=vid(v_uv+off        ).g;
  float b=vid(v_uv+off-grad*cd).b;
  vec3 col=vec3(r,g,b);

  // ── 修改：将硬编码的蓝色替换为自定义的 u_tint ──
  // Depth shading (深水阴影染色)
  col*=mix(u_tint * 1.2, vec3(1.25,1.12,.96), c*.5+.5);

  // Fresnel (表面反光染色)
  vec3 norm=normalize(vec3(-grad*4.,1.));
  float F0=.04+.08*cry;
  float fr=F0+(1.-F0)*pow(1.-abs(norm.z),5.);
  col=mix(col, u_tint*liq + vec3(.78,.90,1.)*cry, fr*.55);

  // Dual-lobe specular (高光保持纯白/亮色)
  vec3 ld=normalize(vec3(-.4,.7,.7));
  vec3 rv=reflect(-ld,norm);
  float sp=pow(max(rv.z,0.),95.)*.9+pow(max(rv.z,0.),6.)*.22;
  col+=mix(vec3(1.,.96,.86),vec3(.88,.94,1.),cry)*sp*(.55+.45*cry);

  // Crystal ice edge (冰晶边缘)
  col=mix(col,vec3(.55,.82,1.)*col*1.45,clamp(abs(lap)*18.*cry,0.,.55));

  gl_FragColor=vec4(clamp(col,0.,1.),1.);
}`;

function buildGPU(){
  mkQuad();
  try{ simP=mkProg(VS,SIM_FS); renP=mkProg(VS,REN_FS); }
  catch(e){ die(e.message); return false; }
  return true;
}

function resize(){
  W=canvas.width =window.innerWidth;
  H=canvas.height=window.innerHeight;
  SW=Math.max(1,Math.floor(W/2));
  SH=Math.max(1,Math.floor(H/2));
  if(!gl) return;
  for(let i=0;i<2;i++){
    if(pp[i]){ gl.deleteFramebuffer(pp[i].f); gl.deleteTexture(pp[i].t); }
    const t=mkFloatTex(SW,SH);
    const f=mkFBO(t);
    gl.bindFramebuffer(gl.FRAMEBUFFER,f);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    pp[i]={f,t};
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}

async function startCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  if(!video){
    video=document.createElement('video');
    video.playsInline=true; video.muted=true; video.autoplay=true;
  }
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{width:{ideal:1280},height:{ideal:720},
             facingMode:facingUser?'user':'environment'},
      audio:false
    });
    video.srcObject=stream;
    await video.play();
    log('CAM OK – move mouse / show hands');
  }catch(e){ die('Camera:\n'+e.message); }
}

function upVidTex(){
  if(!video||video.readyState<2) return;
  if(!vidTex){
    vidTex=gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D,vidTex);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  }
  gl.bindTexture(gl.TEXTURE_2D,vidTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
}

function frame(){
  requestAnimationFrame(frame);
  if(!gl||!pp[0]||!simP) return;
  upVidTex();
  if(!vidTex) return;

  const activePts = pts.filter(p=>p.life>0);
  activePts.forEach(p=>p.life--);
  pts = activePts;

  // SIM PASS
  gl.bindFramebuffer(gl.FRAMEBUFFER,pp[1-cur].f);
  gl.viewport(0,0,SW,SH);
  gl.useProgram(simP);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D,pp[cur].t);
  gl.uniform1i(ul(simP,'u_tex'),0);
  gl.uniform2f(ul(simP,'u_res'),SW,SH);
  gl.uniform1f(ul(simP,'u_mode'),mode);

  const fp=new Float32Array(20), fv=new Float32Array(20);
  const n=Math.min(pts.length,10);
  for(let i=0;i<n;i++){
    fp[i*2]=pts[i].x; fp[i*2+1]=pts[i].y;
    fv[i*2]=pts[i].vx; fv[i*2+1]=pts[i].vy;
  }
  gl.uniform2fv(ul(simP,'u_p'),fp);
  gl.uniform2fv(ul(simP,'u_v'),fv);
  gl.uniform1f(ul(simP,'u_n'),n);
  drawQuad(simP);
  cur=1-cur;

  // RENDER PASS
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,W,H);
  gl.useProgram(renP);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,pp[cur].t);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,vidTex);
  gl.uniform1i(ul(renP,'u_wave'),0);
  gl.uniform1i(ul(renP,'u_vid'),1);
  gl.uniform2f(ul(renP,'u_sr'),SW,SH);
  gl.uniform1f(ul(renP,'u_mode'),mode);
  gl.uniform1f(ul(renP,'u_mirX'),facingUser?1.0:0.0);
  
  // ── 新增：将 JS 中的颜色值传递给着色器 ──
  gl.uniform3f(ul(renP,'u_tint'), tintRGB[0], tintRGB[1], tintRGB[2]);
  
  drawQuad(renP);
}

const TIPS=[4,8,12,16,20];
let mpSending=false;

function initMP(){
  if(typeof Hands==='undefined'){ log('MP not loaded – mouse/touch only'); return; }
  const hands=new Hands({
    locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/'+f
  });
  hands.setOptions({maxNumHands:2,modelComplexity:0,
    minDetectionConfidence:0.5,minTrackingConfidence:0.4});

  hands.onResults(res=>{
    mpSending=false;
    const keepMouse = pts.filter(p=>p._mouse);
    const newMP=[];
    if(res.multiHandLandmarks){
      for(const hand of res.multiHandLandmarks){
        for(const id of TIPS){
          const lm=hand[id];
          if(!lm) continue;
          newMP.push({x:lm.x, y:lm.y, vx:0, vy:0, life:DECAY_FRAMES, _mouse:false});
        }
      }
    }
    const prevMP=pts.filter(p=>!p._mouse);
    for(let i=0;i<Math.min(newMP.length,prevMP.length);i++){
      newMP[i].vx=newMP[i].x-prevMP[i].x;
      newMP[i].vy=newMP[i].y-prevMP[i].y;
    }
    pts=[...keepMouse, ...newMP];
    const n=newMP.length;
    log(n>0 ? `HANDS: ${n} tips | move hand to make waves` : 'HANDS: visible, move hand');
  });

  function sendFrame(){
    if(!mpSending && video && video.readyState>=2){
      mpSending=true;
      hands.send({image:video}).catch(()=>{ mpSending=false; });
    }
    setTimeout(sendFrame, 66);
  }
  setTimeout(sendFrame,1200);
  log('MediaPipe loading… show hand to camera');
}

let mousePt=null;

canvas.addEventListener('mousemove',e=>{
  const x=e.clientX/W, y=e.clientY/H;
  const vx=mousePt?x-mousePt.x:0, vy=mousePt?y-mousePt.y:0;
  pts=pts.filter(p=>!p._mouse);
  const p={x,y,vx,vy,life:3,_mouse:true};
  pts.push(p);
  mousePt={x,y};
});
canvas.addEventListener('mouseleave',()=>{
  pts=pts.filter(p=>!p._mouse); mousePt=null;
});

const tmap={};
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  for(const t of e.changedTouches)
    tmap[t.identifier]={x:t.clientX/W,y:t.clientY/H,vx:0,vy:0,life:3,_mouse:true};
  syncTouch();
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const p=tmap[t.identifier];
    const nx=t.clientX/W, ny=t.clientY/H;
    tmap[t.identifier]={x:nx,y:ny,vx:p?nx-p.x:0,vy:p?ny-p.y:0,life:3,_mouse:true};
  }
  syncTouch();
},{passive:false});
canvas.addEventListener('touchend',e=>{
  for(const t of e.changedTouches) delete tmap[t.identifier];
  syncTouch();
},{passive:false});
function syncTouch(){
  pts=pts.filter(p=>!p._mouse);
  pts.push(...Object.values(tmap));
}

document.getElementById('btn-cam').addEventListener('click',async()=>{
  facingUser=!facingUser; await startCam();
});
document.querySelectorAll('.mb').forEach(b=>{
  b.addEventListener('click',()=>{
    mode=b.dataset.m==='crystal'?1.0:0.0;
    document.querySelectorAll('.mb').forEach(x=>x.classList.toggle('on',x===b));
  });
});

// ── 新增：颜色选择器监听事件 ──
const picker = document.getElementById('tint-picker');
function updateTint(hex) {
  // 把 HEX 颜色 (比如 #ff0000) 转换为 WebGL 需要的 0.0 - 1.0 的 RGB 浮点数
  let bigint = parseInt(hex.slice(1), 16);
  tintRGB[0] = ((bigint >> 16) & 255) / 255.0;
  tintRGB[1] = ((bigint >> 8) & 255) / 255.0;
  tintRGB[2] = (bigint & 255) / 255.0;
}
picker.addEventListener('input', (e) => updateTint(e.target.value));
updateTint(picker.value); // 初始化调用一次

window.addEventListener('resize',resize);

async function main(){
  if(!initGL()) return;
  resize();
  if(!buildGPU()) return;
  await startCam();
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js';
  s.crossOrigin='anonymous';
  s.onload=initMP;
  s.onerror=()=>log('MP CDN failed – mouse/touch only');
  document.head.appendChild(s);
  requestAnimationFrame(frame);
}
main();

})();
</script>
</body>
</html>
